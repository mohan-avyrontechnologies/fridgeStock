name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, format, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The minimum supported version and the current LTS.
        node: ['20.19', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and API tests
        run: npm test
      - name: Build
        run: npm run build

  python:
    # The Python server (server-py, see docs/PYTHON_MIGRATION.md). Its pytest suite includes every case in
    # shared/test-cases, which the Node job above also passes, so the two languages can never disagree.
    name: Python server (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: server-py
    steps:
      - uses: actions/checkout@v4
      # Node runs the embedded MongoDB script (scripts/dev-mongo.mjs), which its own tests check.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm packages
        run: npm ci
        working-directory: .
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Typecheck (pyright)
        run: uv run pyright
      - name: Tests (pytest)
        run: uv run pytest

  e2e:
    name: End-to-end (Playwright)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/.results
