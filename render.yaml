# Render Blueprint for the API (SRD §9: "suitable Node.js hosting").
# New > Blueprint > pick this repo. Then set MONGO_URI (e.g. MongoDB Atlas)
# and CLIENT_ORIGIN (your Vercel URL, exactly, with no trailing slash) in the dashboard.
# The free plan sleeps after about 15 minutes idle, so the first request after that is slow.
# The step-by-step guide is in the README ("Deployment: HTTPS staging on real phones").
services:
  - type: web
    name: cook-first-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w shared && npm run build -w server
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      # The embedded test database is a devDependency; skip its binary download.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: '1'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      # Web Push keys (npm run vapid:keys -w server). Optional: without them reminders stay in-app.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Push to the Android and iOS apps (Firebase service account; see README "Native apps"). Optional.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      # Where the API is reached from outside (https://<this-service>.onrender.com/api). Native push
      # notification buttons call it. Optional for the web app.
      - key: PUBLIC_API_URL
        sync: false
      # Photo Check: set to "on" (also needs ANTHROPIC_API_KEY).
      - key: PHOTO_CHECK
        sync: false
      # Claude API key for AI features (optional). AI_MODEL defaults to claude-sonnet-5-5.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
