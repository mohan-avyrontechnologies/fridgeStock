[project]
name = "cook-first-server"
version = "2.23.0"
description = "The Cook First API in Python: a drop-in replacement for server/ (see docs/PYTHON_MIGRATION.md)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "brotli>=1.2.1",
    "fastapi>=0.162.0",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.uv]
# An application, not a library: run from this folder (uvicorn server_py.main:app), never installed.
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "ASYNC"]

[tool.pyright]
include = ["server_py", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
# One event loop for the whole run: the database connection belongs to the loop it was opened on.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# One group per migration phase, so a PC short of memory can run one at a time (pytest -m phase1).
markers = [
    "phase1: config, database, HTTP behaviour, auth and the config routes",
]
